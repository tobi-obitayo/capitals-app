<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Capitals">
  <!-- Rounded navy tile  matches app primary -->
  <rect width="32" height="32" rx="8" fill="#003057"/>
  <!-- Soft inner wash -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="#003057" stroke="#E8EEF4" stroke-opacity=".12" stroke-width="1"/>

  <!-- Globe -->
  <g fill="none" stroke="#F7F8FA" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="9.25" stroke-width="1.6"/>
    <!-- Meridian -->
    <ellipse cx="16" cy="16" rx="4" ry="9.25" stroke-width="1.25" stroke-opacity=".9"/>
    <!-- Equator + tropics -->
    <path d="M6.75 16h18.5" stroke-width="1.25"/>
    <ellipse cx="16" cy="16" rx="9.25" ry="3.6" stroke-width="1.1" stroke-opacity=".75"/>
  </g>

  <!-- Capital pin (gold) -->
  <g transform="translate(20.2 10.2)">
    <path d="M0-4.2c-2.15 0-3.9 1.7-3.9 3.85 0 2.85 3.9 6.55 3.9 6.55s3.9-3.7 3.9-6.55C3.9-2.5 2.15-4.2 0-4.2z" fill="#B3A369"/>
    <circle cx="0" cy="-0.55" r="1.45" fill="#003057"/>
  </g>
</svg>
